<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lock & Mint Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
    }
    #status {
      margin-top: 20px;
      white-space: pre-wrap;
      border: 1px solid #ccc;
      padding: 10px;
      max-width: 500px;
      word-wrap: break-word;
    }
  </style>
  <!-- Подключаем ethers.js UMD-версию -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body>
  <h1>Lock & Mint Demo</h1>
  <button id="connectBtn">Подключить Phantom (EVM)</button>
  <button id="lockBtn">Заблокировать 0.0002 ETH</button>
  <button id="checkBtn">Проверить Solana-транзакцию</button>

  <pre id="status"></pre>

  <script>
    // Публичный URL сервера (Codespaces проброс порта)
    const serverUrl = "https://fluffy-spoon-q7pr4rxqp79vf4vww-3000.app.github.dev";
    
    let provider, signer, contract;
    let connectedAddress = ""; // Сохраняем адрес, с которого подключились к Phantom

    // Адрес и ABI смарт-контракта ETHLock
    const contractAddress = "0x916ee15E71B5D7D41e99AfE7ea63F40Bf2dd10e6";
    const contractABI = [
      {
        "inputs": [],
        "name": "lockETH",
        "outputs": [],
        "stateMutability": "payable",
        "type": "function"
      }
    ];

    // Функция для вывода текста в элемент #status
    function appendStatus(text) {
      document.getElementById("status").innerText += text + "\n";
    }

    // Функция подключения к Phantom (EVM) и сохранения подключённого адреса
    async function connectPhantom() {
      if (!window.ethereum) {
        appendStatus("Phantom EVM не найден. Убедитесь, что кошелёк установлен и в EVM-режиме.");
        return;
      }
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        connectedAddress = accounts[0]; // Сохраняем адрес подключения
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        contract = new ethers.Contract(contractAddress, contractABI, signer);
        appendStatus("Phantom подключён. Аккаунт: " + connectedAddress);
      } catch (err) {
        appendStatus("Ошибка подключения Phantom: " + err.message);
      }
    }

    // Функция для вызова lockETH (блокировка 0.0002 ETH)
    async function lockETH() {
      if (!contract) {
        appendStatus("Сначала подключите Phantom (EVM).");
        return;
      }
      try {
        const tx = await contract.lockETH({
          value: ethers.utils.parseEther("0.0002")
        });
        appendStatus("Отправлена транзакция lockETH: " + tx.hash + "\nОжидаем подтверждения...");
        const receipt = await tx.wait();
        appendStatus("Транзакция подтверждена в блоке: " + receipt.blockNumber);
      } catch (err) {
        appendStatus("Ошибка lockETH: " + err.message);
      }
    }

    // Функция проверки данных о чеканке с сервера (передаём динамически адрес)
    async function checkSolanaTx() {
      try {
        const addr = connectedAddress || "0xUserAddress"; // если адрес не подключён, используем значение по умолчанию
        const response = await fetch(serverUrl + "/lastMint?address=" + encodeURIComponent(addr));
        const text = await response.text();
        appendStatus(text);
      } catch (err) {
        appendStatus("Ошибка при запросе /lastMint: " + err.message);
      }
    }

    // Назначаем обработчики событий кнопкам
    document.getElementById("connectBtn").addEventListener("click", connectPhantom);
    document.getElementById("lockBtn").addEventListener("click", lockETH);
    document.getElementById("checkBtn").addEventListener("click", checkSolanaTx);
  </script>
</body>
</html>
