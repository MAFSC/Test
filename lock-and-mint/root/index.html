<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lock & Mint Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }
    #status {
      margin-top: 20px;
      white-space: pre-wrap;
      border: 1px solid #ccc;
      padding: 10px;
      max-width: 600px;
      word-wrap: break-word;
    }
  </style>
  <!-- Подключаем UMD-версию ethers.js -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <!-- Подключаем Solana Web3.js (неофициальная UMD сборка) -->
  <script src="https://cdn.jsdelivr.net/gh/solana-labs/solana-web3.js/bundle.js"></script>
</head>
<body>
  <h1>Lock & Mint Demo</h1>
  <button id="connectPhantomBtn">Подключить Phantom (EVM)</button>
  <button id="lockBtn">Заблокировать 0.0002 ETH</button>
  <button id="connectSolflareBtn">Подключить Phantom (Solana)</button>
  <button id="checkBtn">Проверить Solana-транзакцию</button>
  <pre id="status"></pre>

  <script>
    // Замените адрес ниже на тот, по которому реально доступен ваш сервер-оракул.
    // Рекомендуется использовать HTTPS (если ваш сервер поддерживает его)
    const serverUrl = "https://www.mafsc.work.gd";
    
    // -------------------- EVM (Ethereum) --------------------
    let provider, signer, contract;
    let connectedEvmAddress = ""; // адрес, полученный через кошелёк Phantom (EVM)

    // Адрес контракта ETHLock (установлен на Sepolia)
    const contractAddress = "0x916ee15E71B5D7D41e99AfE7ea63F40Bf2dd10e6";
    // ABI для lockETH и события ETHLocked
    const contractABI = [
      {
        "anonymous": false,
        "inputs": [
          { "indexed": true,  "internalType": "address", "name": "user", "type": "address" },
          { "indexed": false, "internalType": "uint256", "name": "depositAmount", "type": "uint256" },
          { "indexed": false, "internalType": "uint64", "name": "sequence", "type": "uint64" }
        ],
        "name": "ETHLocked",
        "type": "event"
      },
      {
        "inputs": [],
        "name": "lockETH",
        "outputs": [],
        "stateMutability": "payable",
        "type": "function"
      }
    ];

    // Функция подключения к кошельку Phantom (EVM)
    async function connectPhantom() {
      if (!window.ethereum) {
        appendStatus("Phantom (EVM) не найден. Убедитесь, что кошелек установлен и работает в EVM режиме.");
        return;
      }
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        connectedEvmAddress = accounts[0];
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        contract = new ethers.Contract(contractAddress, contractABI, signer);
        appendStatus("Phantom (EVM) подключён. Аккаунт: " + connectedEvmAddress);
      } catch (err) {
        appendStatus("Ошибка подключения Phantom (EVM): " + err.message);
      }
    }

    // Функция для вызова lockETH
    async function lockETH() {
      if (!contract) {
        appendStatus("Сначала подключите Phantom (EVM).");
        return;
      }
      try {
        const tx = await contract.lockETH({ value: ethers.utils.parseEther("0.0002") });
        appendStatus("Транзакция lockETH отправлена: " + tx.hash + "\nОжидаем подтверждения...");
        const receipt = await tx.wait();
        appendStatus("Транзакция подтверждена. Block number: " + receipt.blockNumber);
      } catch (err) {
        appendStatus("Ошибка lockETH: " + err.message);
      }
    }

    // -------------------- Solana --------------------
    let connectedSolAddress = "";
    async function connectSolflare() {
      if (window.solana) {
        try {
          const resp = await window.solana.connect();
          connectedSolAddress = resp.publicKey.toString();
          appendStatus("Phantom (Solana) подключён. Аккаунт: " + connectedSolAddress);
        } catch (err) {
          appendStatus("Ошибка подключения Phantom (Solana): " + err.message);
        }
      } else {
        appendStatus("Phantom (Solana) не найден. Проверьте, установлен ли кошелек Phantom для Solana.");
      }
    }

    // Функция проверки Solana-транзакции через сервер-оракул
    async function checkSolanaTx() {
      try {
        // Запрос к вашему серверу-оракулу по маршруту /lastMint с передачей адреса
        const response = await fetch(serverUrl + "/lastMint?address=" + encodeURIComponent(connectedEvmAddress));
        const text = await response.text();
        appendStatus("Ответ сервера:\n" + text);
      } catch (err) {
        appendStatus("Ошибка при запросе /lastMint: " + err.message);
      }
    }

    // Вспомогательная функция для вывода сообщений в элемент #status
    function appendStatus(text) {
      document.getElementById("status").innerText += text + "\n";
    }

    // Навешиваем обработчики событий на кнопки
    document.getElementById("connectPhantomBtn").addEventListener("click", connectPhantom);
    document.getElementById("lockBtn").addEventListener("click", lockETH);
    document.getElementById("checkBtn").addEventListener("click", checkSolanaTx);
    document.getElementById("connectSolflareBtn").addEventListener("click", connectSolflare);

    // Примечание: Вы можете добавить подписку на события Ethereum, если требуется автоматизация,
    // но для демонстрации текущего функционала достаточно вызова этих функций по клику.
  </script>
</body>
</html>
