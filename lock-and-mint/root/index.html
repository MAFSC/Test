<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lock & Mint Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
    }
    #status {
      margin-top: 20px;
      white-space: pre-wrap;
      border: 1px solid #ccc;
      padding: 10px;
      max-width: 500px;
      word-wrap: break-word;
    }
  </style>
  <!-- Connect ethers.js (UMD version) for Phantom (EVM) -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body>
  <h1>Lock & Mint Demo</h1>
  <button id="connectPhantomBtn">Connect Phantom (EVM)</button>
  <button id="lockBtn">Lock 0.0002 ETH</button>
  <button id="checkBtn">Check Solana transaction</button>
  <button id="connectSolflareBtn">Connect Phantom (Solana)</button>
  
  <pre id="status"></pre>

  <script>
    // Public server URL (Codespaces port forwarding)
    const serverUrl = "https://fluffy-spoon-q7pr4rxqp79vf4vww-3000.app.github.dev";
    
    let provider, signer, contract;
    let connectedEvmAddress = ""; // Address connected through Phantom (EVM)
    let connectedSolAddress = ""; // Address connected through Phantom (Solana)

    // ETHLock contract address and ABI (for EVM)
    const contractAddress = "0x916ee15E71B5D7D41e99AfE7ea63F40Bf2dd10e6";
    const contractABI = [
      {
        "inputs": [],
        "name": "lockETH",
        "outputs": [],
        "stateMutability": "payable",
        "type": "function"
      }
    ];

    // Function to output text to #status
    function appendStatus(text) {
      document.getElementById("status").innerText += text + "\n";
    }

    // Connect to Phantom (EVM)
    async function connectPhantom() {
      if (!window.ethereum) {
        appendStatus("Phantom (EVM) not found. Make sure the wallet is installed and in EVM mode.");
        return;
      }
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        connectedEvmAddress = accounts[0];
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        contract = new ethers.Contract(contractAddress, contractABI, signer);
        appendStatus("Phantom connected. Account (EVM): " + connectedEvmAddress);
      } catch (err) {
        appendStatus("Phantom connection error: " + err.message);
      }
    }

    // Connect to Phantom (Solana)
    async function connectSolflare() {
      if (window.solana) {
        try {
          const resp = await window.solana.connect();
          connectedSolAddress = resp.publicKey.toString();
          appendStatus("Phantom connected. Account (Solana): " + connectedSolAddress);
        } catch (err) {
          appendStatus("Phantom connection error: " + err.message);
        }
      } else {
        appendStatus("Phantom wallet not found. Install Phantom wallet.");
      }
    }

    // Call lockETH (lock 0.0002 ETH)
    async function lockETH() {
      if (!contract) {
        appendStatus("Please connect Phantom (EVM) first.");
        return;
      }
      try {
        const tx = await contract.lockETH({
          value: ethers.utils.parseEther("0.0002")
        });
        appendStatus("lockETH transaction sent: " + tx.hash + "\nWaiting for confirmation...");
        const receipt = await tx.wait();
        appendStatus("Transaction confirmed in block: " + receipt.blockNumber);
      } catch (err) {
        appendStatus("lockETH error: " + err.message);
      }
    }

    // Function to check Solana transaction from the server (using response.text())
    async function checkSolanaTx() {
      try {
        // Use the address connected via Phantom (EVM) as a parameter,
        // or a default address if not connected
        const addr = connectedEvmAddress || "0xUserAddress";
        const response = await fetch(serverUrl + "/lastMint?address=" + encodeURIComponent(addr));
        const text = await response.text();
        appendStatus(text);
      } catch (err) {
        appendStatus("Error requesting /lastMint: " + err.message);
      }
    }

    document.getElementById("connectPhantomBtn").addEventListener("click", connectPhantom);
    document.getElementById("connectSolflareBtn").addEventListener("click", connectSolflare);
    document.getElementById("lockBtn").addEventListener("click", lockETH);
    document.getElementById("checkBtn").addEventListener("click", checkSolanaTx);
  </script>
</body>
</html>
