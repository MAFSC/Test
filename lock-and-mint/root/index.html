<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lock & Mint Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
    }
    #status {
      margin-top: 20px;
      white-space: pre-wrap;
      border: 1px solid #ccc;
      padding: 10px;
      max-width: 500px;
      word-wrap: break-word;
    }
  </style>
  <!-- Подключаем ethers.js (UMD версия) для Phantom (EVM) -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <!-- Подключаем Solana Web3.js для работы с Solana -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/@solana/web3.js/1.75.0/web3.umd.min.js"></script>
</head>
<body>
  <h1>Lock & Mint Demo</h1>
  <button id="connectPhantomBtn">Подключить Phantom (EVM)</button>
  <button id="lockBtn">Заблокировать 0.0002 ETH</button>
  <button id="checkBtn">Проверить Solana-транзакцию</button>
  <button id="connectSolflareBtn">Подключить Phantom (Solana)</button>
  <button id="mintTokenBtn">Купить отчеканенный токен</button>

  <pre id="status"></pre>

  <script>
    const serverUrl = "https://fluffy-spoon-q7pr4rxqp79vf4vww-3000.app.github.dev";
    let provider, signer, contract;
    let connectedEvmAddress = "";
    let connectedSolAddress = "";

    const contractAddress = "0x916ee15E71B5D7D41e99AfE7ea63F40Bf2dd10e6";
    const contractABI = [
      { "inputs": [], "name": "lockETH", "outputs": [], "stateMutability": "payable", "type": "function" }
    ];

    function appendStatus(text) {
      document.getElementById("status").innerText += text + "\n";
    }

    async function connectPhantom() {
      if (!window.ethereum) {
        appendStatus("Phantom (EVM) не найден.");
        return;
      }
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        connectedEvmAddress = accounts[0];
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        contract = new ethers.Contract(contractAddress, contractABI, signer);
        appendStatus("Phantom подключён: " + connectedEvmAddress);
      } catch (err) {
        appendStatus("Ошибка Phantom: " + err.message);
      }
    }

    async function connectSolflare() {
      if (window.solana) {
        try {
          const resp = await window.solana.connect();
          connectedSolAddress = resp.publicKey.toString();
          appendStatus("Solflare подключён: " + connectedSolAddress);
        } catch (err) {
          appendStatus("Ошибка Solflare: " + err.message);
        }
      } else {
        appendStatus("Solflare Wallet не найден.");
      }
    }

    async function lockETH() {
      if (!contract) {
        appendStatus("Сначала подключите Phantom (EVM).\n");
        return;
      }
      try {
        const tx = await contract.lockETH({ value: ethers.utils.parseEther("0.0002") });
        appendStatus("Транзакция lockETH отправлена: " + tx.hash);
        const receipt = await tx.wait();
        appendStatus("Транзакция подтверждена в блоке: " + receipt.blockNumber);
      } catch (err) {
        appendStatus("Ошибка lockETH: " + err.message);
      }
    }

    async function checkSolanaTx() {
      try {
        const addr = connectedEvmAddress || "0xUserAddress";
        const response = await fetch(serverUrl + "/lastMint?address=" + encodeURIComponent(addr));
        const text = await response.text();
        appendStatus(text);
      } catch (err) {
        appendStatus("Ошибка запроса /lastMint: " + err.message);
      }
    }

    async function mintToken() {
      if (!connectedSolAddress) {
        appendStatus("Сначала подключите Phantom (Solana).\n");
        return;
      }
      try {
        const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl("devnet"));
        const transaction = new solanaWeb3.Transaction();
        const mintAddress = new solanaWeb3.PublicKey("5YDZuT8SHNDRfmmShNc52jsaNYH56zpSsbA2ooJ5HbTH");
        const recipient = new solanaWeb3.PublicKey(connectedSolAddress);
        const instructions = solanaWeb3.SystemProgram.transfer({
          fromPubkey: recipient,
          toPubkey: mintAddress,
          lamports: 1000000,
        });
        transaction.add(instructions);
        const { signature } = await window.solana.signAndSendTransaction(transaction);
        appendStatus("Токен куплен! Транзакция: " + signature);
      } catch (err) {
        appendStatus("Ошибка покупки токена: " + err.message);
      }
    }

    document.getElementById("connectPhantomBtn").addEventListener("click", connectPhantom);
    document.getElementById("connectSolflareBtn").addEventListener("click", connectSolflare);
    document.getElementById("lockBtn").addEventListener("click", lockETH);
    document.getElementById("checkBtn").addEventListener("click", checkSolanaTx);
    document.getElementById("mintTokenBtn").addEventListener("click", mintToken);
  </script>
</body>
</html>
